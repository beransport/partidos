function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}

const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function flong(s){const d=pd(s);return DOWL[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function isWeekend(s){const g=pd(s).getDay();return g===0||g===6;}

function isOff(c,date){
  if(c.off.includes(date))return true;
  if(DBOFF[c.id]&&DBOFF[c.id].includes(date))return true;
  if(!isWeekend(date)&&Array.isArray(c.wk)&&!c.wk.includes(pd(date).getDay()))return true;

  h+=`<div class="field"><label>Confirmación</label><div class="cop"><label><input type="checkbox" id="f-duda" ${m.duda?"checked":""}> Sin confirmar que se juegue (obras, aplazamiento…)</label><label><input type="checkbox" id="f-sededuda" ${m.sedeDuda?"checked":""}> Sede por confirmar (la fecha sí está clara)</label></div></div>`;
  h+=`<div class="field"><label for="f-note">Notas</label><textarea id="f-note" rows="2" placeholder="Acuerdo con el rival, desplazamiento…">${esc(m.note)}</textarea></div>
    <div class="actions">${m.custom?`<button class="btn danger" data-delm="${m.id}">Eliminar partido</button>`:""}${m.date!==m.orig?`<button class="btn" data-restore="${m.id}">Volver a la fecha FVBPA</button>`:""}<button class="btn primary" id="sheet-close">Hecho</button></div></div></div>`;
  return h;
}
function freeSlots(m){
  const res={};const others=AM().filter(x=>x.date===m.date&&x.id!==m.id);
  const cs=coachesFor(m);
  franjasFor(m.date).forEach(f=>{
    const pistasBusy=new Set(others.filter(x=>x.home&&x.pista&&overlap(x,m,f,true)).map(x=>x.pista));
    const coachBusy=others.some(x=>x.home&&overlap(x,m,f)&&coachesFor(x).some(c=>cs.includes(c)));
    res[f]=pistasFor(m).some(p=>!pistasBusy.has(p.id))&&!coachBusy;});
  return res;
}
function suggestDates(m){
  // sábados futuros donde el equipo no juega, cabe en pista y el reparto de entrenadores sigue completo
  const out=[];const ts=teamsOf(m);
  boardDates().forEach(d=>{
    if(d<TODAY||pd(d).getDay()!==6||d===m.date) return;
    const ms=AM().filter(x=>x.date===d&&x.id!==m.id);
    if(ms.some(x=>teamsOf(x).some(t=>ts.includes(t)))) return;
    if(m.home&&capPenalty(ms.concat([m]))>=1000) return;
    const sim=ms.concat([m]).map(x=>({...x,date:d,coaches:(x.coaches||[]).slice()}));
    const sc=solveDay(sim);
    if(sc>=1000) return;
    const emerg=sim.some(x=>x.coaches.some(id=>id&&coachById(id)?.emerg));
    out.push({d,sc,emerg});});
  return out.sort((a,b)=>a.sc-b.sc||Math.abs(pd(a.d)-pd(m.orig))-Math.abs(pd(b.d)-pd(m.orig))).slice(0,8).sort((a,b)=>a.d.localeCompare(b.d));
}
function autoAssign(date,quiet){
  // búsqueda conjunta de hora y pista para todos los partidos en casa del día, eligiendo la combinación que mejor deja el reparto de entrenadores
  const big=m=>teamsOf(m).some(t=>BIG.includes(t));
  const dayAll=AM().filter(m=>m.date===date);
  const todo=dayAll.filter(m=>m.home&&!(m.pista&&m.hora)).sort((a,b)=>(big(b)-big(a))||ORDER.indexOf(a.team)-ORDER.indexOf(b.team));
  if(!todo.length)return quiet?{n:0,fail:0}:(toast("Ya tienen pista y hora"),undefined);
  const FR=franjasFor(date);
  const sim=dayAll.map(x=>({...x,coaches:(x.coaches||[]).slice()}));
  const byId=Object.fromEntries(sim.map(x=>[x.id,x]));
  const order=todo.map(m=>byId[m.id]);
  const placed=()=>sim.filter(x=>x.home&&x.pista&&x.hora);
  const cands=m=>{const out=[];for(const f of (m.hora?[m.hora]:FR)){const seenK=new Set();for(const p of pistasFor(m)){if(m.pista&&m.pista!==p.id)continue;
      const others=placed().filter(x=>x!==m&&x.pista===p.id);const oh=m.hora,op=m.pista;m.hora=f;m.pista=p.id;
      const bad=others.some(x=>overlap(x,m,null,true));m.hora=oh;m.pista=op;if(bad)continue;
      const kk=(p.teams.join()||"all")+(p.exc?"x":"")+"|"+(others.length?"o":"e");if(seenK.has(kk))continue;seenK.add(kk);out.push([f,p]);}}return out;};
  const blocked=m=>order.filter(x=>x!==m&&!(x.hora&&x.pista)&&!cands(x).length).length;
  const evalSim=()=>{const tmp=sim.map(x=>({...x,coaches:(x.coaches||[]).slice()}));return solveDay(tmp);};
  // dos pasadas: colocar cada partido en el hueco que mejor deja el reparto; luego repasar cada uno con los demás ya puestos
  SIMPOOL=sim;
  for(let pass=0;pass<2;pass++){
    order.forEach(m=>{if(pass===1){m.hora=todo.find(x=>x.id===m.id).hora||"";m.pista=todo.find(x=>x.id===m.id).pista||"";}
      let bestC=null;for(const [f,p] of cands(m)){m.hora=f;m.pista=p.id;let sc=(p.exc?40:0)+FR.indexOf(f)*0.01;if(bestC&&sc>=bestC.sc)continue;sc+=blocked(m)*1000;if(bestC&&sc>=bestC.sc)continue;sc+=evalSim();if(!bestC||sc<bestC.sc)bestC={sc,f,p:p.id};}
      if(bestC){m.hora=bestC.f;m.pista=bestC.p;}else{m.hora=todo.find(x=>x.id===m.id).hora||"";m.pista=todo.find(x=>x.id===m.id).pista||"";}});}
  SIMPOOL=null;
  const best={set:order.map(x=>[x.id,x.hora,x.pista])};
  let n=0,fail=0;
  if(best)best.set.forEach(([id,h,p])=>{const m=S.matches.find(x=>x.id===id);if(h&&p){m.hora=h;m.pista=p;n++;}else fail++;});
  else fail=todo.length;
  if(quiet)return {n,fail};
  persist();render();
  toast(fail?`${n} asignados · ${fail} sin hueco libre`:`${n} partido${n===1?"":"s"} asignado${n===1?"":"s"}`);
}
function autoAll(){let n=0,fail=0;boardDates().forEach(d=>{if(d<TODAY)return;if(!AM().some(m=>m.date===d&&m.home))return;const r=autoAssign(d,true);n+=r.n;fail+=r.fail;});persist();render();toast(fail?`${n} partidos con pista y hora · ${fail} sin hueco`:`${n} partidos con pista y hora`);}

async function toggleOff(cid,d){const c=coachById(cid);if(!c)return;
  if(c.off.includes(d)){c.off=c.off.filter(x=>x!==d);persist();render();return;}
  if(DB){if(offBusy)return;offBusy=true;const cur=(DBOFF[cid]||[]).slice();const next=cur.includes(d)?cur.filter(x=>x!==d):cur.concat([d]).sort();
    DBOFF[cid]=next;reassignAll();render();
    try{await DB.doc("disponibilidad/"+cid).set({off:next});}catch(e){DBOFF[cid]=cur;reassignAll();render();toast("No se pudo guardar. ¿Tienes permiso para editar esta página?");}
    offBusy=false;return;}
  c.off.push(d);persist();render();}
function copyChanges(){
  const mv=AM().filter(m=>m.date!==m.orig).sort((a,b)=>a.orig.localeCompare(b.orig));
  const txt="CV Cangas de Onís · cambios de fecha propuestos (temporada 2026-27)\n\n"+mv.map(m=>`- ${teamLabel(m)} (${TM[m.team].c}): ${m.home?"CV Cangas – "+m.rival:m.rival+" – CV Cangas"} · del ${flong(m.orig)} al ${flong(m.date)}${m.hora?" a las "+m.hora:""} [${ESTL[m.estado||"propuesto"]}]${m.note?" ("+m.note+")":""}`).join("\n");
  const done=()=>toast("Resumen copiado");
  try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt));}catch(_){fallbackCopy(txt);}
}
function fallbackCopy(txt){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(_){}ta.remove();toast(ok?"Resumen copiado":"No se pudo copiar; selecciona el texto en la tabla");}

// ---------- guardar versión (capability artifact) ----------
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(state){
  const style=document.querySelector("style[data-app]")||document.querySelectorAll("style")[document.querySelectorAll("style").length-1];
  const links=[...document.querySelectorAll('link[href^="https://fonts.g"]')].map(l=>l.outerHTML).join("");
  const scr=document.getElementById("app-script").textContent;
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  const SC="scr"+"ipt";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Planificador CV Cangas</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+links+'\n<style data-app>'+style.textContent+'</style>\n<div id="app"></div>\n<'+SC+' type="application/json" id="state">'+json+'</'+SC+'>\n<'+SC+' id="app-script">'+scr+'</'+SC+'>\n</body></html>';
}
async function save(){
  const btn=document.getElementById("save");
  if(!artifactApi){toast("Guardar no está disponible aquí; los cambios siguen en este navegador");return;}
  btn.disabled=true;btn.textContent="Guardando…";
  const st=JSON.parse(JSON.stringify(S));st.savedAt=Date.now();
  try{
    try{localStorage.removeItem(LSKEY);}catch(_){}
    await artifactApi.publish(buildDoc(st));
  }catch(err){
    const code=err&&err.code;
    try{localStorage.setItem(LSKEY,JSON.stringify({baseSavedAt:base.savedAt||0,state:S,matches:1}));}catch(_){}
    if(code==="conflict"){toast("Otra persona guardó antes; se carga su versión");return;}
    if(code==="not_granted"||code==="not_writer"){canSave=false;render();return;}
    btn.disabled=false;btn.textContent="Guardar versión";toast("No se pudo guardar. Inténtalo otra vez.");
  }
}

function goViewer(){if(ui.staff){if(!ui.ro){ui.ro=true;S=JSON.parse(JSON.stringify(base));dirty=false;reassignAll();}render();return;}if(ui.fam===null){ui.fam="";render();}}
function readHash(){try{const hs=decodeURIComponent((location.hash||"").slice(1));if(hs===STAFF||hs.startsWith(STAFF+"/")){ui.staff=true;ui.fam=null;const hc=S.coaches.find(c=>slug(c.name)===hs.slice(STAFF.length+1));if(hc){ui.tab="yo";ui.me=hc.id;}return true;}const tk=TEAMS.find(t=>famSlug(t.k)===hs);if(tk){ui.fam=tk.k;return true;}if(hs==="familias"){ui.fam="";return true;}}catch(_){}return false;}
readHash();
window.addEventListener("hashchange",()=>{if(readHash())render();});
try{const hs=decodeURIComponent((location.hash||"").slice(1));const hc=S.coaches.find(c=>slug(c.name)===hs);if(hc){ui.tab="yo";ui.me=hc.id;}}catch(_){}
reassignAll();
render();
(async()=>{
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(x=>{DL=x;if(x)render();}).catch(()=>{});
    window.claude.use("db").then(x=>{DB=x;if(!x)return;try{x.collection("disponibilidad").onSnapshot(snap=>{const o={};snap.docs.forEach(dc=>{const v=dc.data();if(v&&Array.isArray(v.off))o[dc.id]=v.off.filter(z=>typeof z==="string"&&/^\d{4}-\d\d-\d\d$/.test(z));});DBOFF=o;reassignAll();render();},()=>{});}catch(_){}render();}).catch(()=>{});
  }
  try{const us=window.claude&&window.claude.use?await window.claude.use("user"):null;const can=us&&typeof us.canEdit==="function"?await us.canEdit():false;if(!can)goViewer();}catch(_){goViewer();}
  try{artifactApi=window.claude&&window.claude.use?await window.claude.use("artifact"):null;}catch(_){artifactApi=null;}
  if(!artifactApi){canSave=null;}
  render();
})();
})();
